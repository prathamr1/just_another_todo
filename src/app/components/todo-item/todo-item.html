<li appHighlightcompleted [isCompleted]="todo().completed" class="listitem"> 
        <label for="todo-{{todo().id}}"> {{ todo().title | uppercase}} </label> 
        <input id="todo-{{todo().id}}" 
        type="checkbox" 
        [checked]="todo().completed"
        (change)="this.todoClicked()">
</li>
